<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="pulseLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      fill: #f8fafc;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 500;
      fill: #94a3b8;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .grid-line {
      stroke: #1e293b;
      stroke-opacity: 0.45;
      stroke-width: 1;
    }
    /* Dynamic pulsing animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(-10px, 5px); opacity: 0.65; }
    }
    @keyframes scanMove {
      0% { transform: translateY(0px); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(220px); opacity: 0; }
    }
    @keyframes radarWave {
      0% { r: 10px; opacity: 0.8; }
      100% { r: 120px; opacity: 0; }
    }
    @keyframes nodeBlink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    .animated-orb {
      animation: pulseOrb 8s ease-in-out infinite alternate;
      transform-origin: center;
    }
    .scan-beam {
      animation: scanMove 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .radar-circle-1 {
      animation: radarWave 3.5s ease-out infinite;
    }
    .radar-circle-2 {
      animation: radarWave 3.5s ease-out infinite 1.75s;
    }
    .node-pulse-1 { animation: nodeBlink 2.5s infinite; }
    .node-pulse-2 { animation: nodeBlink 3.2s infinite 0.8s; }
    .node-pulse-3 { animation: nodeBlink 2.8s infinite 1.4s; }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Animated Ambient Light Orbs -->
  <circle cx="150" cy="80" r="160" fill="#0284c7" opacity="0.15" filter="url(#softGlow)" class="animated-orb" />
  <circle cx="1050" cy="280" r="180" fill="#7c3aed" opacity="0.18" filter="url(#softGlow)" class="animated-orb" />
  <circle cx="920" cy="80" r="130" fill="#06b6d4" opacity="0.15" filter="url(#softGlow)" class="animated-orb" />

  <!-- Decorative Subtle Perspective Grid -->
  <g>
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />
    
    <line x1="150" y1="0" x2="150" y2="360" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="360" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="360" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="360" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="360" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="360" class="grid-line" />
    <line x1="1050" y1="0" x2="1050" y2="360" class="grid-line" />
  </g>

  <!-- Right-Hand Dynamic Graphic: Cyber Threat Shield & Radar -->
  <g transform="translate(940, 180)">
    <!-- Radar concentric circles -->
    <circle cx="0" cy="0" r="40" stroke="#38bdf8" stroke-width="1.2" fill="none" opacity="0.3" />
    <circle cx="0" cy="0" r="80" stroke="#38bdf8" stroke-width="1.2" fill="none" opacity="0.2" />
    <circle cx="0" cy="0" r="120" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6" fill="none" opacity="0.25" />
    
    <!-- Dynamic animated radar pulses -->
    <circle cx="0" cy="0" r="20" stroke="#38bdf8" stroke-width="1.5" fill="none" class="radar-circle-1" />
    <circle cx="0" cy="0" r="20" stroke="#818cf8" stroke-width="1.5" fill="none" class="radar-circle-2" />

    <!-- Isometric Mobile & Shield Frame -->
    <polygon points="0,-95 75,-45 75,55 0,105 -75,55 -75,-45" fill="url(#shieldGrad)" stroke="url(#primaryGlow)" stroke-width="2.5" filter="url(#glow)" />
    <polygon points="0,-80 62,-38 62,45 0,88 -62,45 -62,-38" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="6 4" />

    <!-- Dynamic Scanning Line over Shield -->
    <g class="scan-beam">
      <line x1="-70" y1="-90" x2="70" y2="-90" stroke="url(#pulseLine)" stroke-width="3" filter="url(#glow)" />
    </g>

    <!-- Shield Core Lock / Mobile Symbol -->
    <rect x="-18" y="-28" width="36" height="56" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <circle cx="0" cy="18" r="2.5" fill="#38bdf8" />
    <path d="M -8 -8 Q -8 -20 0 -20 Q 8 -20 8 -8" fill="none" stroke="#38bdf8" stroke-width="2" />

    <!-- Connected Threat Telemetry Nodes -->
    <g>
      <line x1="75" y1="-45" x2="130" y2="-75" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="3 3" />
      <circle cx="130" cy="-75" r="5" fill="#06b6d4" class="node-pulse-1" filter="url(#glow)" />

      <line x1="-75" y1="55" x2="-125" y2="85" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="3 3" />
      <circle cx="-125" cy="85" r="5" fill="#8b5cf6" class="node-pulse-2" filter="url(#glow)" />

      <line x1="75" y1="55" x2="135" y2="70" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="3 3" />
      <circle cx="135" cy="70" r="4.5" fill="#38bdf8" class="node-pulse-3" filter="url(#glow)" />
    </g>
  </g>

  <!-- Foreground Main Title & Content -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 52)">
      <rect width="210" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.2" />
      <circle cx="16" cy="15" r="4" fill="#38bdf8" class="node-pulse-1" />
      <text x="28" y="19" fill="#38bdf8" class="tag-text">CYBERSECURITY &amp; EDR</text>
    </g>

    <!-- Main Banner Title (High Contrast & Clear Foreground) -->
    <text x="0" y="132" class="title-text" font-size="44">Awesome Mobile Threat</text>
    <text x="0" y="180" class="title-text" font-size="44" fill="url(#primaryGlow)">Defense (MTD)</text>

    <!-- Subtitle Description -->
    <text x="0" y="218" class="subtitle-text" font-size="16">Curated enterprise platforms, on-device behavioral ML engines,</text>
    <text x="0" y="242" class="subtitle-text" font-size="16">and open-source mobile forensics &amp; application security suites.</text>

    <!-- Interactive / Highlight Pillars -->
    <g transform="translate(0, 276)">
      <!-- Pill 1: Zero Trust -->
      <g transform="translate(0, 0)">
        <rect width="140" height="34" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
        <text x="14" y="22" fill="#38bdf8" class="tag-text">🛡️ ZERO-TRUST</text>
      </g>
      <!-- Pill 2: On-Device ML -->
      <g transform="translate(152, 0)">
        <rect width="150" height="34" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
        <text x="14" y="22" fill="#a78bfa" class="tag-text">⚡ ON-DEVICE ML</text>
      </g>
      <!-- Pill 3: Anti-Phishing -->
      <g transform="translate(314, 0)">
        <rect width="155" height="34" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
        <text x="14" y="22" fill="#34d399" class="tag-text">🔍 ANTI-PHISHING</text>
      </g>
      <!-- Pill 4: Mobile EDR -->
      <g transform="translate(481, 0)">
        <rect width="145" height="34" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
        <text x="14" y="22" fill="#f472b6" class="tag-text">📱 MOBILE EDR</text>
      </g>
    </g>
  </g>
</svg>
